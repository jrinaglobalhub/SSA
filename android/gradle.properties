# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true

# Optimization: Enable PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Optimization: Enable R8 code shrinking and resource shrinking (Disabled for release stability)
android.enableMinifyInReleaseBuilds=false
android.enableShrinkResourcesInReleaseBuilds=false

# Architecture: Target modern 64-bit ARM architecture (arm64-v8a)
# This provides maximum performance and eliminates unused 32-bit/x86 binaries
reactNativeArchitectures=arm64-v8a

# Optimization: Enable New Architecture and Hermes bytecode compiler
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Optimization: Strip unused native media decoders
expo.gif.enabled=false
expo.webp.enabled=true
expo.webp.animated=false

# Optimization: Disable developer network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=false

# Optimization: Modern uncompressed native libs in APK
expo.useLegacyPackaging=false

android.builtInKotlin=false
android.newDsl=false
expo.inlineModules.watchedDirectories=[]
